[package]
name = "azenith-service"
version = "1.0.0"
edition = "2024"

[dependencies]
fs2 = "0.4"
libc = "0.2"
glob = "0.3"
rsbinder = { version = "=0.12.0", features = ["android_14"] }

[build-dependencies]
rsbinder-aidl = "=0.12.0"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[patch.crates-io]
# rsbinder 0.12.0 calls libc::process_vm_readv, which Android's bionic only
# exports from API 23 (missing at cargo-ndk's default API 21). Issue the raw
# syscall instead (Linux >= 3.2). This project targets Android 34+ only, so
# the syscall path is used unconditionally regardless of API level.
rsbinder = { path = "vendor/rsbinder" }